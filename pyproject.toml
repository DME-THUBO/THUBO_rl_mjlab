[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DME-THUBO"
version = "0.1.0"
description = "12-DoF THUBO PPO task for MJLab and MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.1", "mjlab>=1.4"]

[tool.setuptools.packages.find]
include = ["dme_thubo*", "src*"]
